# ============================================
# 本地环境配置模板（脱敏版）
#
# 使用方法：
#   1. 复制本文件，重命名为 application-local.yml
#   2. 把下面的占位符替换成你的真实账号密码
#   3. application-local.yml 已被 .gitignore 忽略，不会提交到 Git
# ============================================
spring:
  # ===== 数据库配置（PostgreSQL）=====
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/b2b_db
    username: your_db_username_here
    password: your_db_password_here

  # ===== Redis 配置 =====
  data:
    redis:
      host: localhost
      port: 6379
      password: your_redis_password_here   # Redis 无密码则留空
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ===== RabbitMQ 配置 =====
  rabbitmq:
    host: localhost
    port: 5672
    username: your_rabbitmq_username_here
    password: your_rabbitmq_password_here
    virtual-host: /
